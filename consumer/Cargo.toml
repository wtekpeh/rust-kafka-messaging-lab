[package]
name = "consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
